<main><button class="music-toggle" type="button" aria-pressed="false" aria-label="播放背景音乐"><span class="music-icon" aria-hidden="true"><i></i><i></i><i></i></span><span>MUSIC</span></button><audio preload="auto" loop="" src="./audio/invitation-wedding-375839.mp3"></audio><section class="act-one" aria-labelledby="invitation-title"><img class="act-one-image" src="./images/cover.jpg" alt="房家鸣和张甜甜在雪山湖泊前手持红色囍字的合影" width="1905" height="1280"/><div class="act-one-shade"></div><div class="act-one-topline"><time dateTime="2026-08-30">2026.08.30</time><span>临沂</span></div><div class="act-one-copy"><h1 id="invitation-title"><span>房家鸣</span><i>♥</i><span>张甜甜</span></h1><p>婚礼邀请</p></div><a class="scroll-cue" href="#date" aria-label="向下浏览婚礼邀请"><span></span>SCROLL</a></section><section class="date-interlude" id="date" aria-label="婚礼日期"><time dateTime="2026-08-30">08.30</time></section><section class="act-two" aria-label="婚礼合影与邀请语"><figure class="white-frame"><img src="./images/photo-01.jpg" alt="房家鸣和张甜甜在湖畔草地上的婚纱合影" width="1365" height="2048" loading="lazy" decoding="async"/></figure><p>诚邀您来见证</p></section><section class="act-three" aria-label="婚礼仪式时间"><img src="./images/photo-03.jpg" alt="房家鸣和张甜甜坐在绿色草原上，身前摆放红色囍字，远处有牛群" width="1365" height="2048" loading="lazy" decoding="async"/><time dateTime="2026-08-30T11:58:00+08:00">11:58</time></section><section class="wedding-details" id="details" aria-labelledby="details-title"><div class="wedding-details-copy"><p>婚礼仪式</p><h2 id="details-title">2026年8月30日</h2><p>星期日</p><time dateTime="2026-08-30T11:58:00+08:00">上午11:58</time><address><span>山东省临沂市</span><strong>临沂宾馆</strong></address><a href="https://j.map.baidu.com/3e/DNE" target="_blank" rel="noopener noreferrer">打开百度地图 <span aria-hidden="true">↗</span></a></div></section><section class="rsvp" aria-labelledby="rsvp-title"><div class="rsvp-copy"><p class="edition">Your Reply</p><h2 id="rsvp-title">回复邀请</h2><p>请告诉我们是否赴宴</p></div><div id="rsvp-form-slot"></div></section><footer class="closing"><img src="./images/cover.jpg" alt="房家鸣和张甜甜在雪山湖泊前手持红色囍字的合影" width="1905" height="1280" loading="lazy" decoding="async"/><div class="closing-shade"></div><div id="approved-message-slot"></div><div class="closing-copy"><p aria-hidden="true">囍</p><h2>期待相见</h2><span>房家鸣 <i aria-hidden="true">♥</i> 张甜甜</span></div><a class="song-link" href="https://y.qq.com/n/ryqq/search?w=%E5%B0%86%E6%95%85%E4%BA%8B%E5%86%99%E6%88%90%E6%88%91%E4%BB%AC" target="_blank" rel="noopener noreferrer">在QQ音乐搜索《将故事写成我们》 ↗</a></footer></main>
<script>
(() => {
  const RSVP_API_BASE = "https://fangjm007-d6g2haxg47e345568-1461851777.ap-shanghai.app.tcloudbase.com/api";
  const button = document.querySelector('.music-toggle');
  const audio = document.querySelector('audio');
  if (button && audio) {
    const markPlaying = () => {
      button.setAttribute('aria-pressed', 'true');
      button.setAttribute('aria-label', '暂停背景音乐');
      button.lastElementChild.textContent = 'PAUSE';
    };
    const markPaused = () => {
      button.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-label', '播放背景音乐');
      button.lastElementChild.textContent = 'MUSIC';
    };
    const tryPlay = async () => {
      try {
        await audio.play();
        markPlaying();
        return true;
      } catch {
        markPaused();
        return false;
      }
    };
    button.addEventListener('click', async () => {
      if (audio.paused) {
        await tryPlay();
      } else {
        audio.pause();
        markPaused();
      }
    });
    // 打开页面默认开启音乐:加载后直接尝试播放;
    // 浏览器(尤其手机)会拦截无交互的自动播放,此时首次点击/触摸页面任意位置即自动播放
    tryPlay();
    // 音频就绪后重试(慢网络下初次尝试可能因音频还没加载完成而失败)
    audio.addEventListener('canplay', () => { if (audio.paused) tryPlay(); });
    // 微信旧版 WebView 桥接就绪时重试
    document.addEventListener('WeixinJSBridgeReady', () => { if (audio.paused) tryPlay(); });
    // 自动下滑开始时再重试一次
    document.addEventListener('autoscroll:start', () => { if (audio.paused) tryPlay(); });
    const firstGesture = () => {
      if (audio.paused) tryPlay();
      document.removeEventListener('click', firstGesture);
      document.removeEventListener('touchstart', firstGesture);
    };
    document.addEventListener('click', firstGesture, { passive: true });
    document.addEventListener('touchstart', firstGesture, { passive: true });
  }

  // 自动下滑:平滑连续滚动依次经过每一页,最后停留在最后一页(收尾页)
  const pages = Array.from(document.querySelectorAll('main > section, footer.closing'));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rafId = null;
  let autoIndex = 1;
  let autoRunning = false;
  function animateScrollTo(targetY, duration) {
    return new Promise((resolve) => {
      const html = document.documentElement;
      const prevBehavior = html.style.scrollBehavior;
      html.style.scrollBehavior = 'auto';
      const finish = () => { html.style.scrollBehavior = prevBehavior; resolve(); };
      const startY = window.scrollY;
      const dist = targetY - startY;
      if (!autoRunning || Math.abs(dist) < 1) { finish(); return; }
      const start = performance.now();
      const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      const frame = (now) => {
        if (!autoRunning) { finish(); return; }
        const p = Math.min(1, (now - start) / duration);
        window.scrollTo(0, startY + dist * ease(p));
        if (p < 1) { rafId = requestAnimationFrame(frame); } else { finish(); }
      };
      rafId = requestAnimationFrame(frame);
    });
  }
  async function startAutoScroll() {
    if (reduceMotion || autoRunning || pages.length < 2) return;
    autoRunning = true;
    document.dispatchEvent(new CustomEvent('autoscroll:start'));
    while (autoRunning && autoIndex < pages.length) {
      const target = pages[autoIndex].getBoundingClientRect().top + window.scrollY;
      await animateScrollTo(target, 1500);
      autoIndex += 1;
      if (autoRunning && autoIndex < pages.length) {
        await new Promise((r) => { rafId = setTimeout(r, 2000); });
      }
    }
    autoRunning = false;
  }
  const stopAutoScroll = () => {
    if (!autoRunning) return;
    autoRunning = false;
    cancelAnimationFrame(rafId);
    clearTimeout(rafId);
    document.removeEventListener('touchstart', stopAutoScroll);
    document.removeEventListener('wheel', stopAutoScroll, { passive: true });
    document.removeEventListener('pointerdown', stopAutoScroll);
  };
  // 用户手动操作(触摸/滚轮/点击)立即停止自动下滑
  document.addEventListener('touchstart', stopAutoScroll, { passive: true });
  document.addEventListener('wheel', stopAutoScroll, { passive: true });
  document.addEventListener('pointerdown', stopAutoScroll);
  // 打开页面停留片刻(等封面完全加载)再开始自动下滑
  window.setTimeout(startAutoScroll, 5500);

  const messageSlot = document.querySelector('#approved-message-slot');
  let messages = [];
  const isPublicMessage = (item) => item
    && typeof item === 'object'
    && typeof item.name === 'string'
    && typeof item.message === 'string';

  function renderMessages() {
    if (!messageSlot) return;
    messageSlot.replaceChildren();
    if (!messages.length) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'approved-messages';
    wrapper.setAttribute('aria-label', '宾客祝福');
    const track = document.createElement('div');
    track.className = 'approved-message-track';
    [...messages, ...messages].forEach((item, index) => {
      const paragraph = document.createElement('p');
      if (index >= messages.length) paragraph.setAttribute('aria-hidden', 'true');
      const messageText = document.createElement('span');
      messageText.textContent = item.message;
      const guest = document.createElement('small');
      guest.append(document.createTextNode('— ' + item.name));
      paragraph.append(messageText, guest);
      track.append(paragraph);
    });
    wrapper.append(track);
    messageSlot.append(wrapper);
  }

  const slot = document.querySelector('#rsvp-form-slot');
  if (slot) {
    slot.innerHTML = '<form class="rsvp-form" novalidate>' +
      '<label><span>姓名</span><input name="name" autocomplete="name" maxlength="40" placeholder="请输入姓名"></label>' +
      '<fieldset><legend>是否赴宴</legend>' +
      '<label><input type="radio" name="attendance" value="yes"><span>欣然赴约</span></label>' +
      '<label><input type="radio" name="attendance" value="no"><span>无法到场</span></label></fieldset>' +
      '<label><span>赴宴人数</span><input name="partySize" type="number" inputmode="numeric" min="1" max="20" placeholder="1"></label>' +
      '<label><span>留言 <small>选填</small></span><textarea name="message" maxlength="120" rows="3" placeholder="写下想对我们说的话"></textarea></label>' +
      '<label class="rsvp-honeypot" aria-hidden="true"><span>网站</span><input name="website" tabindex="-1" autocomplete="off"></label>' +
      '<button type="submit">回复邀请 <span aria-hidden="true">→</span></button>' +
      '<p class="form-feedback" aria-live="polite"></p></form>';
    slot.querySelector('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const data = new FormData(form);
      const name = String(data.get('name') || '').trim();
      const attendance = String(data.get('attendance') || '');
      const rawPartySize = String(data.get('partySize') || '').trim();
      const message = String(data.get('message') || '').trim();
      const website = String(data.get('website') || '').trim();
      const feedback = form.querySelector('.form-feedback');
      const submit = form.querySelector('button[type="submit"]');
      let partySize = null;
      let validationMessage = '';
      if (!name) validationMessage = '请填写姓名';
      else if (name.length > 40) validationMessage = '姓名请控制在40个字以内';
      else if (!['yes', 'no'].includes(attendance)) validationMessage = '请选择是否赴宴';
      else if (attendance === 'yes' && (!/^\d+$/.test(rawPartySize) || Number(rawPartySize) < 1 || Number(rawPartySize) > 20)) validationMessage = '请填写1至20人的赴宴人数';
      else if (message.length > 120) validationMessage = '留言请控制在120个字以内';
      else if (website) validationMessage = '提交失败，请稍后重试';
      else if (!RSVP_API_BASE) validationMessage = '当前为预览模式，信息不会上传';
      if (validationMessage) {
        feedback.dataset.state = 'error';
        feedback.textContent = validationMessage;
        return;
      }
      if (attendance === 'yes') partySize = Number(rawPartySize);
      submit.disabled = true;
      submit.firstChild.textContent = '正在提交… ';
      feedback.dataset.state = '';
      feedback.textContent = '正在提交…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(RSVP_API_BASE + '/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, attendance, partySize, message, website }),
          signal: controller.signal,
        });
        let result;
        try { result = await response.json(); } catch { result = null; }
        if (!response.ok || result?.ok !== true || typeof result?.message !== 'string') {
          throw new Error(typeof result?.message === 'string' ? result.message : '提交失败，请稍后重试');
        }
        if (result.publicMessage !== undefined && !isPublicMessage(result.publicMessage)) {
          throw new Error('提交失败，请稍后重试');
        }
        if (result.publicMessage) {
          messages.unshift(result.publicMessage);
          messages = messages.slice(0, 30);
          renderMessages();
          // 滚动到页面末尾的留言墙,让宾客看到自己的留言
          requestAnimationFrame(() => {
            messageSlot.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });
        }
        feedback.dataset.state = 'success';
        feedback.textContent = result.publicMessage
          ? result.message + '。留言已显示在页面末尾。'
          : result.message;
        form.reset();
      } catch (error) {
        feedback.dataset.state = 'error';
        feedback.textContent = error?.message && /[\u4e00-\u9fff]/.test(error.message)
          ? error.message
          : '提交失败，请稍后重试';
      } finally {
        clearTimeout(timeout);
        submit.disabled = false;
        submit.firstChild.textContent = '回复邀请 ';
      }
    });
  }

  if (messageSlot && RSVP_API_BASE) {
    fetch(RSVP_API_BASE + '/messages', { headers: { Accept: 'application/json' } })
      .then((response) => response.ok ? response.json() : Promise.reject(new Error('messages unavailable')))
      .then((result) => {
        if (!Array.isArray(result?.messages) || !result.messages.every(isPublicMessage)) return;
        messages = result.messages.slice(0, 30);
        renderMessages();
      })
      .catch(() => {});
  }
})();
</script>
