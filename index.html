<script>
(() => {
  const button = document.querySelector('.music-toggle');
  const audio = document.querySelector('audio');
  if (button && audio) {
    button.addEventListener('click', async () => {
      if (audio.paused) {
        try {
          await audio.play();
          button.setAttribute('aria-pressed', 'true');
          button.setAttribute('aria-label', '暂停背景音乐');
          button.lastElementChild.textContent = 'PAUSE';
        } catch {
          button.setAttribute('aria-pressed', 'false');
        }
      } else {
        audio.pause();
        button.setAttribute('aria-pressed', 'false');
        button.setAttribute('aria-label', '播放背景音乐');
        button.lastElementChild.textContent = 'MUSIC';
      }
    });
  }

  const slot = document.querySelector('#rsvp-form-slot');
  if (slot) {
    slot.innerHTML = '<form class="rsvp-form" novalidate>' +
      '<label><span>姓名</span><input name="name" autocomplete="name" placeholder="请输入姓名"></label>' +
      '<fieldset><legend>是否赴宴</legend>' +
      '<label><input type="radio" name="attendance" value="yes"><span>欣然赴约</span></label>' +
      '<label><input type="radio" name="attendance" value="no"><span>无法到场</span></label></fieldset>' +
      '<label><span>赴宴人数</span><input name="partySize" type="number" inputmode="numeric" min="1" max="12" placeholder="1"></label>' +
      '<button type="submit">生成预览回执 <span aria-hidden="true">→</span></button>' +
      '<p class="form-feedback" aria-live="polite"></p></form>';
    slot.querySelector('form').addEventListener('submit', (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const data = new FormData(form);
      const name = String(data.get('name') || '').trim();
      const attendance = String(data.get('attendance') || '');
      const partySize = Number(data.get('partySize'));
      const feedback = form.querySelector('.form-feedback');
      let valid = false;
      let message = '';
      if (!name) message = '请填写姓名';
      else if (!['yes', 'no'].includes(attendance)) message = '请选择是否赴宴';
      else if (attendance === 'yes' && (!Number.isInteger(partySize) || partySize < 1)) message = '请填写赴宴人数';
      else { valid = true; message = '已生成预览回执（信息不会上传）'; }
      feedback.dataset.state = valid ? 'success' : 'error';
      feedback.textContent = message;
      if (valid) form.reset();
    });
  }
})();
</script>
